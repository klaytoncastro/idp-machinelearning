services:
  mlflow:
    build: .
    container_name: mlops-lab-mlflow
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  trainer:
    build: .
    container_name: mlops-lab-trainer
    working_dir: /workspace
    command: ["bash", "-lc", "sleep infinity"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - .:/workspace
    depends_on:
      mlflow:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  mlflow-data:
