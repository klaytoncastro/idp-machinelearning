# Para acelerar com GPU, combine com um overlay:
#   NVIDIA (Linux / Windows+WSL2): docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-lab
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
